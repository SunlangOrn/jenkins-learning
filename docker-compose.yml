services:

  postgres-db:
    image: postgres:15-alpine
    container_name: jenkins_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jenkins_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jenkins-net

  jenkins-demo-app:
    image: ornsunlang/jenkins-demo:${IMAGE_TAG:-latest}
    container_name: jenkins-app
    ports:
      - "8080:1200"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - jenkins-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    ports:
      - "8888:8080"
      - "50000:50000"
    volumes:
      - old_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_OPTS=--httpPort=8080
    restart: always
    networks:
      - jenkins-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube-server
    ports:
      - "9000:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: always
    networks:
      - jenkins-net

volumes:
  postgres_data:
  old_jenkins_home:
    external: true
    name: jenkins_home
  sonarqube_data:
  sonarqube_extensions:

networks:
  jenkins-net:
    name: jenkins-net